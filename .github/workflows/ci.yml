name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

# A new push to a pull request cancels the run it makes obsolete; every commit on master keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      # A failure on one platform must not cancel the others: the full picture tells whether it is platform-specific.
      fail-fast: false
      matrix:
        # Windows is the development platform, and path checks depend on the operating system.
        os: [ubuntu-latest, windows-latest]
        # 22 is the minimum of "engines", 24 the current LTS.
        node: [22, 24]
    steps:
      # Actions pinned to a full commit SHA: a moved or compromised tag cannot change what runs. Dependabot updates them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes: the token is not left in the git config.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          # Safe here: this workflow holds no secret and publishes nothing, so a poisoned cache could not steal anything.
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
